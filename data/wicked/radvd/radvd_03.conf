interface xxx
{
        AdvSendAdvert on;
        AdvManagedFlag off;             ## no stateful DHCPv6 addresses
        AdvOtherConfigFlag off;         ## no stateless DHCPv6 (DNS, ...)
        AdvDefaultLifetime 1800;        ## >0 to set default route to RA sender
        MinRtrAdvInterval 3;
        MaxRtrAdvInterval 10;

        prefix slaac_prefix {
                AdvOnLink on;
                AdvAutonomous on;       ## SLAAC
                AdvValidLifetime 3600;
                AdvPreferredLifetime 2400;
        };

        RDNSS slaac_dns {
                AdvRDNSSLifetime 900;
        };

        DNSSL slaac.example.net {
                AdvDNSSLLifetime 900;
        };
};
