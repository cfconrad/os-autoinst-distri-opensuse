
# Used to connect the ovn-controller to each other. This
# IP address will be assigned to $CTRL_IFC on each host
HOST1_IP=${HOST1_IP:-10.200.0.1}
HOST2_IP=${HOST2_IP:-10.200.0.2}
HOST3_IP=${HOST3_IP:-10.200.0.3}

CTRL_IFC=${CTRL_IFC:-en0}

# If set, the VLAN ID in which the HOSTX_IP will be used
CTRL_VLAN=${CTRL_VLAN:-2014}

# DPDK DATA plane. Used to transfer data between the hosts.
HOST1_DATA_IP=${HOST1_DATA_IP:-192.168.100.1}
HOST2_DATA_IP=${HOST2_DATA_IP:-192.168.100.2}
HOST3_DATA_IP=${HOST3_DATA_IP:-192.168.100.3}

# If set, the VLAN_ID in which the data will be transfer
DATA_VLAN=${DATA_VLAN:-2015}

# The IP address of the corresponding interface on each
# host. This is used to access the hosts and use iperf
# to check throughput
HOST1_TEST_IP=${HOST1_TEST_IP:-192.168.201.10}
HOST2_TEST_IP=${HOST2_TEST_IP:-192.168.202.10}
HOST3_TEST_IP=${HOST3_TEST_IP:-192.168.203.10}

# For testing, ovn create 3 virtual routers and each host
# has his own subnet in it.
ROUTER1_TEST_IP=${ROUTER1_TEST_IP:-192.168.201.1}
ROUTER2_TEST_IP=${ROUTER2_TEST_IP:-192.168.202.1}
ROUTER3_TEST_IP=${ROUTER3_TEST_IP:-192.168.203.1}

# The PCI_ID of the network interface which will be bound
# to DPDK
HOST1_DATA_PCI_ID=${HOST1_DATA_PCI_ID:-0000:00:08.0}
HOST2_DATA_PCI_ID=${HOST2_DATA_PCI_ID:-0000:00:08.0}
HOST3_DATA_PCI_ID=${HOST3_DATA_PCI_ID:-0000:00:08.0}

# Number of 2MB hugepages which get alloced before binding the
# DPDK interface
HUGEPAGES_2M=${HUGEPAGES_2M:-513}

